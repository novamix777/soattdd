<main class="exito-container">
  <section class="exito-card">
    <div class="exito-icono" aria-hidden="true">✓</div>

      <div class="detalle-fila">

        <span class="detalle-valor" id="exito-placa">ABC123</span>
      </div>
      <div class="detalle-fila">
        <span class="detalle-label">Medio de pago</span>
        <span class="detalle-valor" id="exito-medio">Tarjeta / QR</span>
      </div>
      <div class="detalle-fila">
        <span class="detalle-label">Total</span>
        <span class="detalle-valor" id="exito-total">$540.000</span>
      </div>
      <div class="detalle-fila">
        <span class="detalle-label">Fecha y hora</span>
        <span class="detalle-valor" id="exito-fecha">—</span>

<script>
(function () {
  'use strict';

  function leerJSON(key) {
    var raw = sessionStorage.getItem(key) || localStorage.getItem(key);
    if (!raw) return null;
    try { return JSON.parse(raw); } catch (e) { return null; }
  }

  var resumen = leerJSON('resumen_soat') || {};
  var intento = leerJSON('ultimo_intento_pago') || {};
  var cotizacion = leerJSON('cotizacion_soat') || {};

  var placa = intento.placa || resumen.placa || cotizacion.placa || 'ABC123';
  var total = intento.total || resumen.total_formato || '$540.000';
  var medio = intento.medio || resumen.medio || 'Confirmación de pago';
  var ref = intento.referencia || resumen.referencia || ('TX-' + Math.floor(100000 + Math.random() * 900000));

  var fechaTexto;
  if (intento.fecha) {
    var d = new Date(intento.fecha);
    fechaTexto = isNaN(d.getTime()) ? intento.fecha : d.toLocaleString('es-CO');
  } else {
    fechaTexto = new Date().toLocaleString('es-CO');
  }

  document.getElementById('exito-referencia').textContent = ref;
  document.getElementById('exito-placa').textContent = placa;
  document.getElementById('exito-medio').textContent = medio;
  document.getElementById('exito-total').textContent = total;
  document.getElementById('exito-fecha').textContent = fechaTexto;
})();
</script>
