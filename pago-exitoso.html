<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pago exitoso | SOAT</title>
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  body{font-family:'Ubuntu',sans-serif;background:#f4f7f9;margin:0;display:flex;align-items:center;justify-content:center;min-height:100vh}
  .card{background:#fff;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.08);padding:40px 32px;text-align:center;max-width:420px;width:90%}
  .ok{font-size:3.5rem;color:#28a745}
  h1{color:#066188;margin:12px 0}
  p{color:#5c6b7a}
  a{display:inline-block;margin-top:20px;background:#0a99d6;color:#fff;text-decoration:none;padding:12px 24px;border-radius:8px;font-weight:700}
  a:hover{background:#087daf}
</style>
</head>
<body>
  <div class="card">
    <div class="ok">✓</div>
    <h1>¡Pago recibido!</h1>
    <p>Hemos registrado tu solicitud de SOAT.<br>En breve recibirás la confirmación.</p>
    <p id="detalle" style="font-size:.9rem;color:#6c7a89"></p>
    <a href="index.html">Volver al inicio</a>
  </div>
<script>
(function(){
  try{
    var d = JSON.parse(sessionStorage.getItem('ultimo_intento_pago')||'{}');
    var el = document.getElementById('detalle');
    if(d.placa) el.textContent = 'Placa: '+d.placa+' · Total: '+(d.total||'');
  }catch(e){}
})();
</script>
</body>
</html>
